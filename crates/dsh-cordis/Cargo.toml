[package]
name = "dsh-cordis"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
compio = ["dsh-runtime/compio"]

[dependencies]
dsh-runtime = { path = "../dsh-runtime", default-features = false }
futures = "0.3"
serde_json = "1"

[dev-dependencies]
dsh-runtime = { path = "../dsh-runtime", features = ["tokio"] }
serde_json = "1"
