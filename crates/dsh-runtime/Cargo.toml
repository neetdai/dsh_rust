[package]
name = "dsh-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
compio = ["dep:compio"]

[dependencies]
futures = "0.3"
tokio = { version = "1.52", optional = true, features = ["rt", "rt-multi-thread", "time", "sync"] }
compio = { version = "0.19", optional = true, default-features = false, features = ["runtime", "time"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
